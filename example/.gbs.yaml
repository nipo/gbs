# .gbs.yaml
# Tree-level GBS configuration for example projects
#
# This configuration is shared by all example projects in this directory tree.
# Each example project references the "simulation" profile defined here.

tools:
  # GHDL from PATH (system installation)
  - name: ghdl
    variant: system
    config:
      executable: ghdl

  - name: ghdl
    variant: jit
    config:
      executable: /Users/nipo/local/bin/ghdl

  - name: gcc
    variant: system
    config:
      executable: gcc

  - name: gowin
    variant: V1.9.11.03
    config:
      # This path is where "IDE" and "Programmer" directories are
      path: /opt/Gowin/GowinIDE.app/Contents/Resources/Gowin_EDA
    message:
      level_force:
        EX4800: INFO
        CV0017: INFO
        CV0018: INFO
        EX4319: INFO
        EX4196: INFO

# Common Repositories
# This NSL library repository is used by all example projects
# NOTE: Adjust this path to match your local NSL installation
repositories:
  - path: /Users/nipo/projects/nsl_clean
    loader: nsl-tree
