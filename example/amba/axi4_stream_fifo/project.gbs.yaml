name: simple_project
topcell: top
output_format: filelist

# Use the simulation profile defined in ../../.gbs.yaml
# This provides: filter_vars, backends, and repository configuration
profile: simulation

root_library:
  name: root
  partitions:
    - name: top
      deps:
        - nsl_data.bytestream
        - nsl_data.endian
        - nsl_data.crc
        - nsl_data.prbs
        - nsl_data.text
        - nsl_simulation.assertions
        - nsl_simulation.driver
        - nsl_simulation.logging
        - nsl_amba.axi4_stream
        - nsl_amba.stream_fifo
      sources:
        - language: vhdl
          files:
            - top.vhd

