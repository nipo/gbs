name: simple_project

root:
  name: top
  deps:
    - nsl_data.text
    - nsl_simulation.assertions
  sources:
    - file_type: vhdl
      files:
        - top.vhd

output:
  - name: simulation
    topcell: top
    filter_vars: {}
    backend_config:
      gbs.backend.ghdl:
        vhdl_standard: "1993"
        ghdl_tool: "ghdl:jit"
    outputs:
      - type: ghdl-simulator
        path: build/top

