name: simple_project
toolsuite:
  name: ghdl
  backend: gbs.backend.GHDLBackend
topcell: top

output_format: filelist

filter_vars:
  target: simulation

backends:
  - backend: gbs.backend:GHDLBackend
    config:
      output_dir: build

root_library:
  name: root
  partitions:
    - name: top
      deps:
        - nsl_data.text
        - nsl_simulation.assertions
      sources:
        - language: vhdl
          files:
            - top.vhd
repositories:
  - path: /Users/nipo/projects/nsl_clean
    loader: gbs.plugin.nsl.tree

