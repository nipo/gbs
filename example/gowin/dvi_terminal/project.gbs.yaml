name: dvi_terminal

root:
  name: top
  deps:
    - nsl_video.mode
    - nsl_video.pixel_stream
    - nsl_digilent.pmod
    - nsl_clocking.async
    - nsl_clocking.distribution
    - nsl_event.tick
    - nsl_clocking.pll
    - nsl_dvi.transceiver
    - nsl_video.pattern
    - nsl_dvi.encoder
    - nsl_video.terminal
    - nsl_indication.font_6x8
    - nsl_indication.font_4x6
    - nsl_hwdep.clock
    - nsl_hwdep.reset
    - nsl_io.io
    - nsl_io.clock
    - nsl_io.diff
    - nsl_logic.bool
    - nsl_math.fixed
    - nsl_signal_generator.trigonometry
    - nsl_uart.serdes
  sources:
    - file_type: vhdl
      files:
        - src/top.pkg.vhd
        - src/boundary.vhd
        - src/main.vhd
    - file_type: gowin-cst
      files:
        - src/hdmi.cst
        - src/done_led.cst
        - src/ready_led.cst
        - src/buttons.cst
        - src/clk.cst
        - src/uart.cst
    - file_type: gowin-sdc
      files:
        - src/clk.sdc
        - src/clocks.sdc

output:
  - name: synthesis
    topcell: boundary
    target:
      part: GW5AT-LV60PG484AC1/I0
      use_as_gpio:
        - sspi
        - done
        - ready
        - cpu
    outputs:
      - type: bitstream
        path: dvi_terminal.fs
      - type: pnr-report
        path: pnr-report.html
      - type: timing-summary
        path: timing.yaml
        