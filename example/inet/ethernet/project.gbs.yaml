name: inet_ethernet

root:
  name: main
  deps:
   - nsl_inet.ethernet
   - nsl_mii.link_monitor
   - nsl_mii.rgmii
   - nsl_mii.testing
   - nsl_data.text
   - nsl_data.bytestream
   - nsl_bnoc.testing
   - nsl_simulation.driver
   - nsl_simulation.assertions
  sources:
    - language: vhdl
      files:
        - root.pkg.vhd
        - tb.vhd
        - dut.vhd

output:
  - name: simulation
    topcell: tb
    filter_vars: {}
    backend_config:
      gbs.backend.ghdl:
        vhdl_standard: "93c"
        ghdl_tool: "ghdl:system"
    outputs:
      - type: ghdl-simulator
        path: build/tb

