name: nsl_cdc_demo
description: NSL CDC constraint generation demo

target:
  part: GW5AT-LV60PG484AC1/I0

root:
  name: top
  sources:
    - file_type: vhdl
      files:
        - nsl_cdc_test.vhd
    - file_type: gowin-cst
      files:
        - pins.cst

output:
  - name: synthesis
    topcell: nsl_cdc_test
    filter_vars:
      vendor: gowin
      target: synthesis
    backend_config:
      gbs.builtin.gowin:
        part: GW5AT-LV60PG484AC1/I0
      gbs.plugin.nsl:
        output_dir: build
    outputs:
      - type: gowin-fs
        path: build/nsl_cdc_demo.fs
