name: pwm_ip

root:
  name: top
  sources:
    - file_type: vhdl
      files:
        - hdl/pwm_generator.vhd
    - file_type: xilinx-xdc
      files:
        - timing.xdc

output:
  - name: ip_package
    topcell: pwm_generator
    target:
      part: xc7z020clg400-1
    backend_config:
      gbs.builtin.vivado-ip:
        tool: vivado
        vendor: gbs
        library: example
        name: pwm_generator
        version: "1.0"
        taxonomy: /UserIP
        display_name: "PWM Generator"
        description: "Configurable PWM output with generic counter width"
        supported_families:
          - zynq
          - artix7
          - kintex7
    outputs:
      - type: vivado-ip-zip
        path: pwm_generator_1.0.zip
