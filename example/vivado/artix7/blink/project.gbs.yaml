name: blink

root:
  name: top
  sources:
    - file_type: vhdl
      files:
        - boundary.vhd
    - file_type: xilinx-xdc
      files:
        - led.xdc
  deps:
    - nsl_hwdep.clock

output:
  - name: synthesis
    topcell: boundary
    backend_config:
      gbs.builtin.vivado:
        target:
          part: xc7a35t-2csg324
    outputs:
      - type: vivado-bitstream
        path: blink.bit
      - type: vivado-synthesis-report
        path: synthesis-report.html
      - type: vivado-pnr-report
        path: pnr-report.html
