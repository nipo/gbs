name: blink

root:
  name: top
  sources:
    - file_type: vhdl
      files:
        - clock.pkg.vhd
        - clock_internal_gowin.vhd
        - boundary.vhd
    - file_type: gowin-cst
      files:
        - done_led.cst

output:
  - name: synthesis
    topcell: boundary
    filter_vars:
      vendor: gowin
      target: synthesis
    target:
      part: GW5AT-LV60PG484AC1/I0
      use_as_gpio:
        - done
        - jtag
    backend_config:
      gbs.backend.gowin:
        part: GW5AT-LV60PG484AC1/I0
    outputs:
      - type: gowin-fs
        path: build/blink.fs
