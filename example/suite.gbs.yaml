# GBS Suite Example
#
# This file demonstrates suite configuration for building multiple
# GBS projects together. Suites are useful for CI/CD integration
# and regression testing.

name: gbs-examples
description: Example GBS projects demonstrating various features

settings:
  # Maximum number of projects to build in parallel
  max_parallel_projects: 4

  # Stop execution on first failure
  stop_on_failure: false

  # Output configuration
  output:
    # JUnit XML for CI/CD integration
    junit_xml: test-results/junit.xml

    # JSON summary for programmatic access
    summary_json: test-results/summary.json

    # Save individual project logs
    log_dir: test-results/logs
    save_logs: true

# Projects to build
projects:
  # Basic GHDL example
  - name: hello
    path: ghdl/hello
    tags: [ghdl, simulation]

  # Basic GHDL example
  - name: hello-vhpidirect
    path: ghdl/hello-vhpidirect
    tags: [ghdl, vhpidirect, simulation]

  # NSL GHDL example
  - name: amba
    path: ghdl/amba/axi4_stream_fifo
    tags: [ghdl, nsl, simulation]

  # NSL CDC Demo (if available)
  - name: nsl-cdc-demo
    path: gowin/nsl_cdc_demo
    tags: [gowin, nsl, cdc]
    skip: true  # Skip by default (may require additional setup)

  - name: ice40-synth
    path: yosys/ice40/blink
    tags: [synth, yosys, ice40]

  - name: gowin-synth
    path: gowin/tang_60k/blink
    tags: [synth, gowin]
