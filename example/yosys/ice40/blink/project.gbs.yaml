name: blink

root:
  name: top
  deps:
    - nsl_hwdep.clock
  sources:
    - file_type: vhdl
      files:
        - blink.vhd
    - file_type: ice40-pcf
      files:
        - blink.pcf

output:
  - name: pnr
    topcell: top
    target:
      part: iCE40UP5K-SG48I
    outputs:
      - type: bitstream
        path: blink.bin
      - type: synthesis-report
        path: synthesis-report.html
      - type: pnr-report
        path: pnr-report.html
