name: blink

root:
  name: top
  deps:
    - nsl_hwdep.clock
  sources:
    - file_type: vhdl
      files:
        - blink.vhd
    - file_type: ecp5-lpf
      files:
        - icepi-zero.lpf

output:
  - name: pnr
    topcell: top
    target:
      part: 25k
      package: CABGA256
    outputs:
      - type: bitstream
        path: blink.bin

