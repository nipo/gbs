name: blink

root:
  name: top
  deps:
    - nsl_hwdep.clock
  sources:
    - file_type: vhdl
      files:
        - blink.vhd
    - file_type: ecp5-lpf
      files:
        - icepi-zero.lpf

output:
  - name: pnr
    topcell: top
    backend_config:
      gbs.builtin.ghdl:
        vhdl_standard: "1993"
      gbs.builtin.yosys:
        yosys_tool: "yosys"
        steps:
          - flatten
          - tribuf -logic
          - deminout
      gbs.builtin.nextpnr:
        nextpnr_tool: "nextpnr-ecp5"
        part: 25k
        package: CABGA256
      gbs.builtin.ecppack:
        ecppack_tool: "ecppack"
    outputs:
      - type: ecp5-bitstream
        path: blink.bin

