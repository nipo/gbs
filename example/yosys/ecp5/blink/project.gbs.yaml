name: blink

root:
  name: top
  deps:
    - nsl_hwdep.clock
  sources:
    - file_type: vhdl
      files:
        - blink.vhd
    - file_type: ecp5-lpf
      files:
        - icepi-zero.lpf

output:
  - name: pnr
    topcell: top
    target:
      part: 25k
      package: CABGA256
    backend_config:
      gbs.builtin.ghdl:
        vhdl_standard: "1993"
      gbs.builtin.yosys:
        tool: "yosys"
        steps:
          - flatten
          - tribuf -logic
          - deminout
      gbs.builtin.nextpnr:
        tool: "nextpnr-ecp5"
      gbs.builtin.ecppack:
        tool: "ecppack"
    outputs:
      - type: bitstream
        path: blink.bin

