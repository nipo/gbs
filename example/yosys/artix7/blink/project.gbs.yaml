name: blink

root:
  name: top
  sources:
    - file_type: vhdl
      files:
        - boundary.vhd
    - file_type: xilinx-xdc
      files:
        - led.xdc
  deps:
    - nsl_hwdep.clock

output:
  - name: bitstream
    topcell: boundary
    target:
      part: xc7a35t-2csg324
    outputs:
      - type: bitstream
        path: blink.bit
      - type: synthesis-report
        path: synthesis-report.html
      - type: pnr-report
        path: pnr-report.html
