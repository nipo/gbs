# .gbs.yaml
# Tree-level GBS configuration
#
# Place this file at the root of your project tree (like .git).
# It applies to all GBS projects in this tree and subdirectories.
#
# Tree config is discovered by walking up from CWD (first found wins).
# Merge order: user config → tree config → project config (later wins)

# Project-specific tool overrides
tools:
  # Override GHDL to use project-specific version
  - name: ghdl
    variant: system
    config:
      executable: ./tools/ghdl/bin/ghdl

  # Project uses specific GCC
  - name: gcc
    variant: system
    config:
      executable: /usr/bin/gcc-12

# Project-specific profiles
profiles:
  # Project's default simulation setup
  default-sim:
    filter_vars:
      sim: 1
      vendor: xilinx
      fpga_family: zynq
      # Note: target=simulation is automatically set by GHDL backend
    backends:
      - backend: gbs.backend:GHDLBackend
        config:
          output_dir: build/sim
          vhdl_std: "08"
    repositories:
      - path: libs/project-specific

  # Hardware-in-the-loop testing
  hil-test:
    filter_vars:
      sim: 1
      hil: 1
      vendor: xilinx
      # Note: target=simulation is automatically set by GHDL backend
    backends:
      - backend: gbs.backend:GHDLBackend
        config:
          output_dir: build/hil
          vhdl_std: "08"
    repositories:
      - path: libs/project-specific
      - path: libs/hil-framework

# Project tree repositories
# These are relative to this .gbs.yaml file
repositories:
  - path: libs/vendor-ip
  - path: libs/common
  - path: ../shared-libs/utils
