# ~/.config/gbs.yaml
# Basic user-wide GBS configuration
#
# This file defines tools and profiles that apply to all your GBS projects.
# Place this file at: ~/.config/gbs.yaml

# Tool Definitions
# Define tools with optional variants for different installations
tools:
  # Default GHDL from PATH
  - name: ghdl
    variant: system
    config:
      executable: ghdl

  # GHDL LLVM variant (if you have multiple installations)
  - name: ghdl
    variant: llvm
    config:
      executable: /usr/local/bin/ghdl-llvm

  # GCC compiler
  - name: gcc
    variant: system
    config:
      executable: gcc

# Profiles
# Named configuration sets for common scenarios
profiles:
  # Simulation profile
  simulation:
    filter_vars:
      sim: 1
      vendor: generic
      # Note: target=simulation is automatically set by GHDL backend
    backends:
      - backend: gbs.backend:GHDLBackend
        config:
          output_dir: build
          vhdl_std: "08"
    repositories: []

  # Xilinx synthesis profile
  xilinx:
    filter_vars:
      sim: 0
      vendor: xilinx
    backends:
      - backend: gbs.backend:GHDLBackend
        config:
          output_dir: build/xilinx
          vhdl_std: "93c"
    repositories: []

# Global Repositories
# Repositories available to all projects
repositories: []
