# project.gbs.yaml
# Example project with explicit configuration (no profile)
#
# Use this approach when you want full control or when your configuration
# doesn't fit into a reusable profile.

name: custom_project
topcell: system_top
output_format: filelist

# Explicit filter variables
filter_vars:
  sim: 1
  vendor: xilinx
  fpga_family: zynq
  custom_feature: enabled

# Explicit backend configuration
backends:
  - backend: gbs.backend:GHDLBackend
    config:
      output_dir: build/custom
      vhdl_std: "08"
      ghdl_tool: ghdl:llvm  # Use specific GHDL variant

  # Could add more backends here
  # - backend: gbs.backend:VivadoBackend
  #   config:
  #     ...

# Root library
root_library:
  name: custom
  description: Custom project with explicit config

  partitions:
    - name: core
      sources:
        - language: vhdl
          files:
            - src/core/processor.vhd
            - src/core/memory.vhd

    - name: peripherals
      deps:
        - custom.core
      sources:
        - language: vhdl
          files:
            - src/periph/uart.vhd
            - src/periph/spi.vhd

# Explicit repository list
# Note: Config-level repositories are still merged in automatically
repositories:
  - path: ip/xilinx-cores
  - path: ip/custom-blocks
  - path: ../shared/verification
