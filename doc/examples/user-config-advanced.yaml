# ~/.config/gbs.yaml
# Advanced user-wide GBS configuration
#
# This example demonstrates all configuration features:
# - Multiple tool variants
# - Complex profiles
# - Shared repositories

# Tool Definitions with Variants
tools:
  # Multiple GHDL installations
  - name: ghdl
    variant: system
    config:
      executable: ghdl

  - name: ghdl
    variant: llvm
    config:
      executable: /opt/ghdl-llvm/bin/ghdl

  - name: ghdl
    variant: gcc
    config:
      executable: /opt/ghdl-gcc/bin/ghdl

  # GCC variants
  - name: gcc
    variant: system
    config:
      executable: gcc

  - name: gcc
    variant: "11"
    config:
      executable: gcc-11

  # Vivado (if installed)
  - name: vivado
    variant: "2023.2"
    config:
      executable: /opt/Xilinx/Vivado/2023.2/bin/vivado
      settings64: /opt/Xilinx/Vivado/2023.2/settings64.sh

  # Quartus (if installed)
  - name: quartus
    variant: "23.1"
    config:
      executable: /opt/intelFPGA/23.1/quartus/bin/quartus_sh

# Profiles for Different Scenarios
profiles:
  # Quick simulation with GHDL
  sim-quick:
    filter_vars:
      sim: 1
      vendor: generic
      optimization: 0
      # Note: target=simulation is automatically set by GHDL backend
    backends:
      - backend: gbs.backend:GHDLBackend
        config:
          output_dir: build/sim
          vhdl_std: "08"
          ghdl_tool: ghdl  # Uses first matching variant (system)
    repositories:
      - path: ~/gbs-libs/simulation

  # Optimized simulation
  sim-opt:
    filter_vars:
      sim: 1
      vendor: generic
      optimization: 2
      # Note: target=simulation is automatically set by GHDL backend
    backends:
      - backend: gbs.backend:GHDLBackend
        config:
          output_dir: build/sim-opt
          vhdl_std: "08"
          ghdl_tool: ghdl:llvm  # Use LLVM variant
    repositories:
      - path: ~/gbs-libs/simulation

  # Xilinx Synthesis
  xilinx-synth:
    filter_vars:
      sim: 0
      vendor: xilinx
      fpga_family: artix7
    backends:
      - backend: gbs.backend:GHDLBackend
        config:
          output_dir: build/xilinx
          vhdl_std: "93c"
      # Could add Vivado backend here
    repositories:
      - path: ~/gbs-libs/xilinx

  # Intel/Altera Synthesis
  intel-synth:
    filter_vars:
      sim: 0
      vendor: intel
      fpga_family: cyclone_v
    backends:
      - backend: gbs.backend:GHDLBackend
        config:
          output_dir: build/intel
          vhdl_std: "93c"
      # Could add Quartus backend here
    repositories:
      - path: ~/gbs-libs/intel

  # ASIC/Generic synthesis
  asic:
    filter_vars:
      sim: 0
      vendor: generic
      target-usage: asic
    backends:
      - backend: gbs.backend:GHDLBackend
        config:
          output_dir: build/asic
          vhdl_std: "08"
    repositories: []

# Global Repositories
# These are available to ALL projects automatically
repositories:
  # Shared company/team library
  - path: ~/gbs-libs/common
    loader: gbs.loaders.yaml  # Optional: specify custom loader

  # Personal utilities library
  - path: ~/gbs-libs/utils
