[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gbs"
version = "0.1.0"
description = "Gateware Build System - A build system for FPGA and ASIC projects"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "GBS Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pyyaml>=6.0",
    "asyncclick>=8.1.7.2",
    "tqdm>=4.66",
    "pywinpty>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]

[project.scripts]
gbs = "gbs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gbs"]

[tool.hatch.build.targets.wheel.force-include]
"src/gbs/builtin/gowin/resources" = "gbs/builtin/gowin/resources"

[tool.hatch.build.targets.sdist]
include = [
    "src/gbs/**/*.py",
    "src/gbs/builtin/gowin/resources/**/*.vhdl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.envs.default]
features = ["dev"]
